# Publica el generador de voz propio en Modal.
# Las claves de Modal están en los secretos del repositorio (Settings → Secrets and variables → Actions):
# MODAL_TOKEN_ID y MODAL_TOKEN_SECRET. La clave del generador (TTS_AUTH) se deriva del secreto, igual que hace el motor.
name: modal-deploy
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["modal/**", ".github/workflows/modal-deploy.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q modal
      - name: Clave del generador
        run: |
          AUTH=$(printf '%s' "${MODAL_TOKEN_SECRET}tts" | sha256sum | cut -c1-48)
          echo "::add-mask::$AUTH"
          modal secret create faceless-tts TTS_AUTH="$AUTH" --force > /dev/null
      - run: modal deploy modal/tts_app.py
      - run: modal deploy modal/tts_es_app.py
