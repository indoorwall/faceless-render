<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conexión con YouTube · Faceless Studio</title>
<style>
:root{--bg:#F2F3F7;--ink:#14161C;--muted:#636979;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1014;--ink:#ECEEF3;--muted:#9299A8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1014;--ink:#ECEEF3;--muted:#9299A8;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box;text-align:center}
h1{font-size:22px;margin:0 0 8px} p{color:var(--muted);margin:0}
</style>
</head>
<body>
<div><h1 id="t">Conexión con YouTube</h1><p id="m">Ya puedes cerrar esta pestaña.</p></div>
<script>
// La función youtube-auth redirige aquí con ?ok=1&canal=… o ?error=…
const q = new URLSearchParams(location.search);
const ok = q.get("ok") === "1";
document.getElementById("t").textContent = ok ? `Conectado a ${q.get("canal") || "YouTube"}` : (q.get("error") || "No se pudo conectar");
if (q.get("aviso")) document.getElementById("m").textContent = q.get("aviso") + " Ya puedes cerrar esta pestaña.";
try { if (ok && window.opener) window.opener.postMessage("yt-connected", "*"); } catch (e) {}
</script>
</body>
</html>
